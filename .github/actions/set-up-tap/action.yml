name: Set up the tap
description: Makes the checkout the tap nomux-sh/tap in the Homebrew installation of the runner.

# Homebrew is a part of the GitHub runner images. The action uses that
# installation and does not update it.
runs:
  using: composite
  steps:
    - name: Add Homebrew to PATH
      if: runner.os == 'Linux'
      shell: bash
      run: echo "/home/linuxbrew/.linuxbrew/bin" >>"$GITHUB_PATH"
    # The link makes this checkout the tap `nomux-sh/tap`, thus the jobs use
    # the formula of the checkout and not the one on `main`.
    - name: Make this checkout the tap
      shell: bash
      run: |
        set -euo pipefail
        brew --version
        taps="$(brew --repository)/Library/Taps/nomux-sh"
        mkdir -p "$taps"
        ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
        brew trust nomux-sh/tap
