name: CI

# The shared jobs call the reusable workflows of the organization. The steps
# are in https://github.com/nomux-sh/.github/tree/main/.github/workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo-lint:
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: code
      require-changelog: false

  formula:
    name: formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # Without a token, Homebrew 7.0.14 on Linux runs `git
      # credential-osxkeychain`, and an install can stop with "Broken pipe".
      # Refer to https://github.com/Homebrew/brew/issues/24651.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/set-up-tap
      # The target is the formula. With the tap as the target, `brew style`
      # also applies the Bash rules of Homebrew to the POSIX scripts.
      - name: brew style
        run: brew style nomux-sh/tap/nomux
      - name: brew audit
        run: brew audit --strict --online nomux-sh/tap/nomux
      # The other jobs install one bottle each. This step downloads the four
      # archives and the bottles and compares each one with its checksum.
      - name: Verify the checksums of all four archives
        if: matrix.os == 'ubuntu-latest'
        run: brew fetch --all-platforms nomux-sh/tap/nomux
      # Homebrew reads the version of the Command Line Tools with `pkgutil
      # --pkg-info com.apple.pkg.CLTools_Executables`. The step writes an old
      # version into that package receipt. System Integrity Protection is off
      # on the GitHub macOS runners, thus the receipt can change. The runner is
      # discarded after the job.
      - name: Make the Command Line Tools look outdated
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          receipt=/Library/Apple/System/Library/Receipts/com.apple.pkg.CLTools_Executables.plist
          cp "$receipt" "$RUNNER_TEMP/clt-receipt.plist"
          sudo plutil -replace PackageVersion -string 10.0.0.0.1.1 "$receipt"
          brew config | grep -E '^(macOS|CLT|Xcode):'
      - name: Show that a build from source stops
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if brew install --build-from-source nomux-sh/tap/nomux 2>"$RUNNER_TEMP/build.log"; then
            echo "The build from source did not stop." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/build.log"
          grep -q 'Your Command Line Tools are too outdated.' "$RUNNER_TEMP/build.log"
      - name: brew install
        run: brew install nomux-sh/tap/nomux
      - name: Run nomux
        run: |
          set -euo pipefail
          nomux --version
          nomux new
          nomux ls
          nomux daemon stop
      - name: Write the receipt of the Command Line Tools back
        if: runner.os == 'macOS'
        run: sudo cp "$RUNNER_TEMP/clt-receipt.plist" /Library/Apple/System/Library/Receipts/com.apple.pkg.CLTools_Executables.plist
      - name: brew test
        run: brew test nomux-sh/tap/nomux

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh tests/*.sh
      - name: Test the update script
        run: tests/update-formula.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color
